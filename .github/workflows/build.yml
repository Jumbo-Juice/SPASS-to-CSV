name: Build APK

# Builds the release APK on GitHub's runners, which have the Android SDK that a local
# machine would otherwise need. Every run attaches the APK as a downloadable artifact;
# pushing a `v*` tag also publishes it as a GitHub Release asset, which gives a direct
# download link that needs no GitHub login.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Empty unless the repository defines the secrets; see README for how to set them.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run conversion tests
        run: ./gradlew :core:test

      - name: Configure signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<PROPERTIES
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Report how the APK was signed
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signed with the repository release key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No signing secrets configured, so this APK is signed with the standard" \
                 "Android debug key. It installs fine for personal use, but do not" \
                 "distribute it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spass-to-csv-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/*.apk \
            --title "SPASS to CSV Converter ${GITHUB_REF_NAME}" \
            --generate-notes
